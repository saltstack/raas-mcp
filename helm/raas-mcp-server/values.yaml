# Default values for raas-mcp-server Helm chart.
# See the README.md for full documentation on each field.

replicaCount: 1

image:
  repository: raas-mcp-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -------------------------------------------------------------------------
# RaaS MCP server configuration (maps to HttpServerConfig env vars)
# -------------------------------------------------------------------------
config:
  # Required: RaaS base URL.
  raasUrl: ""
  raasInsecure: false
  raasTimeout: "60.0"

  # Network ports
  mcpPort: 8080
  metricsPort: 9090

  # Auth
  tokenTtlSeconds: 3600

  # CORS — comma-separated origin list (empty = CORS disabled)
  corsAllowedOrigins: ""

  # SSE keepalive and graceful shutdown
  keepaliveInterval: 15
  prestopDrainSeconds: 15
  maxRaasTimeoutSeconds: 60

  # Tool filtering (comma-separated; empty = all tools allowed)
  allowedTools: ""
  # Approval gate (comma-separated; empty = no gate)
  approvalGate: ""

# -------------------------------------------------------------------------
# VCF SSO / VIDB JWT authentication (optional)
# Set auth.vidb.issuerUrl to activate the VIDB JWT path; leave empty to
# use only the opaque /token path (HTTP Basic Auth exchange).
# See specs/010-mcp-remote-transport/quickstart.md Section 5 for setup.
# -------------------------------------------------------------------------
auth:
  vidb:
    # OIDC issuer URL for VIDB token validation.
    # Example: https://vidb.vcf.example.com/oidc/tenant-id
    # Empty string (default) disables the VIDB JWT path.
    issuerUrl: ""
    # JWKS cache TTL in seconds (min: 300, max: 86400, default: 43200 = 12 h)
    jwksRefreshIntervalSeconds: 43200

# -------------------------------------------------------------------------
# Direct TLS (opt-in; prefer Ingress TLS in production)
# -------------------------------------------------------------------------
tls:
  enabled: false
  # Name of a Kubernetes Secret with tls.crt and tls.key
  secretName: ""
  certPath: /certs/tls.crt
  keyPath: /certs/tls.key

# -------------------------------------------------------------------------
# Kubernetes Service
# -------------------------------------------------------------------------
service:
  type: ClusterIP
  mcpPort: 8080
  metricsPort: 9090

# -------------------------------------------------------------------------
# Ingress
# -------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: raas-mcp.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: raas-mcp-tls
    #   hosts:
    #     - raas-mcp.example.com

# -------------------------------------------------------------------------
# Resource limits
# -------------------------------------------------------------------------
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# -------------------------------------------------------------------------
# Horizontal Pod Autoscaler
# -------------------------------------------------------------------------
hpa:
  # When enabled, sticky Ingress sessions are strongly recommended;
  # the ingress template sets the nginx affinity annotation automatically.
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# -------------------------------------------------------------------------
# Liveness / readiness probes
# -------------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /health/live
    port: mcp
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health/ready
    port: mcp
  initialDelaySeconds: 5
  periodSeconds: 10

# Graceful drain time must be > terminationGracePeriodSeconds of preStop hook
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
