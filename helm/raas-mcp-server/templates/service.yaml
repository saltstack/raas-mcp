apiVersion: v1
kind: Service
metadata:
  name: {{ include "raas-mcp-server.fullname" . }}
  labels:
    {{- include "raas-mcp-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "raas-mcp-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: mcp
      port: {{ .Values.service.mcpPort }}
      targetPort: mcp
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
