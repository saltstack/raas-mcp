[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raas-mcp-server"
version = "0.1.0"
description = "MCP server that exposes the RaaS API as tools for AI agents (Cursor, Claude Desktop, etc.)."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.27.0",
  "pyyaml>=6.0.1",
  "prometheus-client>=0.20.0",
  "starlette>=0.40.0",
  "uvicorn>=0.30.0",
  "anyio>=4.0.0",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8.0",
]

[project.optional-dependencies]
# Install SSEApiClient from the Broadcom internal PyPI mirror:
#   PIP_INDEX_URL=.../saltstack-pypi-virtual/simple pip install -e '.[vendor]'
# or install a local wheel first, then pip install -e .
vendor = ["SSEApiClient>=8.18.4.0,<9"]
# Local / CI:  pip install -e '.[test]'
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
raas-mcp-server = "raas_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["raas_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::pytest.PytestUnknownMarkWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
