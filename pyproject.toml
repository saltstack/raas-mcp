[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raas-mcp-server"
version = "0.1.0"
description = "MCP server that exposes the RaaS API as tools for AI agents (Cursor, Claude Desktop, etc.)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "raas-mcp contributors"}]
maintainers = [{name = "raas-mcp contributors"}]
keywords = ["salt", "saltstack", "raas", "mcp", "model-context-protocol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "mcp>=1.27.0,<2",
  "pyyaml>=6.0.1",
  "prometheus-client>=0.20.0",
  "starlette>=1.3.1",
  "uvicorn>=0.30.0",
  "anyio>=4.0.0",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.13.0",
  "cryptography>=49.0.0",
]

[project.optional-dependencies]
# Local / CI:  pip install -e '.[dev]'  (or '.[test]' for just the test deps)
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5,<8", "respx>=0.21", "pip-audit>=2.7,<3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5,<8", "respx>=0.21", "ruff>=0.9,<1", "build>=1.2,<2", "pip-audit>=2.7,<3"]

[project.scripts]
raas-mcp-server = "raas_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/saltstack/raas-mcp"
Documentation = "https://github.com/saltstack/raas-mcp#readme"
Repository = "https://github.com/saltstack/raas-mcp"
Issues = "https://github.com/saltstack/raas-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["raas_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::pytest.PytestUnknownMarkWarning"]

[tool.coverage.run]
branch = true
source = ["raas_mcp"]
omit = ["raas_mcp/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
