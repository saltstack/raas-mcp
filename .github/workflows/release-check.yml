name: Release checks

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Secret scan + version match + in-process smoke test
        run: python scripts/check_release.py

      - name: Build sdist/wheel
        run: python -m build
